name: Personal Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Verify tag matches personal version manifest
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" || {
            echo "$GITHUB_REF_NAME must be an annotated tag" >&2
            exit 1
          }
          git fetch origin '+refs/heads/p/ai_open:refs/remotes/origin/p/ai_open'
          TAG_COMMIT="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          CHANNEL_COMMIT="$(git rev-parse refs/remotes/origin/p/ai_open)"
          test "$TAG_COMMIT" = "$CHANNEL_COMMIT" || {
            echo "tag commit $TAG_COMMIT is not the p/ai_open channel head $CHANNEL_COMMIT" >&2
            exit 1
          }
          EXPECTED="v$(node -p "require('./dev-version.json').version")"
          test "$GITHUB_REF_NAME" = "$EXPECTED" || {
            echo "tag $GITHUB_REF_NAME does not match dev-version.json ($EXPECTED)" >&2
            exit 1
          }
      - run: bun run build
      - name: Read release notes from annotated tag
        id: notes
        run: |
          {
            echo 'body<<RELEASE_EOF'
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo 'RELEASE_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.body }}
