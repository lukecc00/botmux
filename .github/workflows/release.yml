name: Personal Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install -g pnpm@9.5.0
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches personal version manifest
        run: |
          EXPECTED="v$(node -p "require('./dev-version.json').version")"
          test "$GITHUB_REF_NAME" = "$EXPECTED" || {
            echo "tag $GITHUB_REF_NAME does not match dev-version.json ($EXPECTED)" >&2
            exit 1
          }
      - run: pnpm build
      - name: Read release notes from annotated tag
        id: notes
        run: |
          {
            echo 'body<<RELEASE_EOF'
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo 'RELEASE_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.body }}
